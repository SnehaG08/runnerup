<head><script src="csi.js-master/csi.min.js"></script></head>

<div data-include="assets/header.html"></div>


<div class="form form-blue">
    <div class="form-heading form-blue-heading"> Login to your Account </div>
    <div class="form-content form-blue-content">
        <form action="">            
            <div class="input-text-box">
                <label for="uemail" class="form-label form-label-blue" required>Email Address<span style="color: red;">*</span></label>
                <input type="email" name="uemail" id="uemail" class="uemail input-text input-text-blue" placeholder="eg: doejohn@gmail.com">
            </div>
            
            <div class="input-text-box">
                <label for="upass" class="form-label form-label-blue">Password<span style="color: red;">*</span></label>
                <input type="password" name="" id="upass" class="upass input-text input-text-blue" minlength="8" required>
            </div>

            
            
            <div class="text-center">
                <button type="submit" class="btn btn-submit">Login</button>    
            </div>
            
        </form>
    </div>
</div>
<div class="signup-link text-center">
    Not a memeber yet? <a href="register.html">Sign Up now</a>
</div>
